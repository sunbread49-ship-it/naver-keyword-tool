name: 대시보드 배포

# dashboard/ 변경사항을 push하면 GitHub Pages에 바로 반영.
# 데이터 자체는 Claude가 아이템스카우트에서 수동으로 긁어와 dashboard/data.json을 커밋하는 방식이라
# 네이버 API 기반 자동 스캔은 더 이상 하지 않음 (검색광고 API compIdx가 상품수 대신 쓰기엔
# 부정확하다고 판단해 폐기 - README 참고).

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

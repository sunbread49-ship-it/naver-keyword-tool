name: 일일 키워드 스캔

on:
  schedule:
    # 매일 KST 오전 7시 (UTC 22:00 전날) 실행. 필요시 시간 수정.
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 수동으로도 "Run workflow" 버튼으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: 키워드 스캔 실행
        working-directory: backend
        env:
          NAVER_APIHUB_CLIENT_ID: ${{ secrets.NAVER_APIHUB_CLIENT_ID }}
          NAVER_APIHUB_CLIENT_SECRET: ${{ secrets.NAVER_APIHUB_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: python main.py

      - name: 결과 커밋 (db + dashboard/data.json)
        run: |
          git config user.name "keyword-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/keywords.db dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: 일일 키워드 스캔 결과 갱신 $(date -u +%F)"
          git push

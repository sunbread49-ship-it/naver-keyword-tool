<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키워드 스카우트</title>
<style>
  :root {
    --bg: #12151a;
    --surface: #1a1e26;
    --surface-2: #212630;
    --border: #2a3040;
    --text: #e4e7ec;
    --muted: #8b93a3;
    --accent: #e0a537;
    --accent-dim: #4a3f26;
    --good: #5fb88a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    font-size: 14px;
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .meta {
    color: var(--muted);
    font-size: 13px;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 16px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .controls input, .controls select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    width: 100px;
    font-size: 13px;
  }
  .controls .stat {
    margin-left: auto;
    display: flex;
    gap: 20px;
  }
  .stat-item { text-align: right; }
  .stat-num { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 11px; color: var(--muted); }

  main { padding: 0 32px 40px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }
  th, td {
    padding: 9px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child,
  th:nth-child(2), td:nth-child(2) {
    text-align: left;
    font-variant-numeric: normal;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  th:hover { color: var(--text); }
  tbody tr:hover { background: var(--surface); }
  .kw {
    font-weight: 500;
  }
  .badge-new {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--accent-dim);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: middle;
  }
  .ratio-bar-bg {
    background: var(--surface-2);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .ratio-bar-fill {
    height: 100%;
    background: var(--good);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
  }
</style>
</head>
<body>
  <header>
    <h1>키워드 스카우트</h1>
    <div class="meta" id="generated-at">데이터 불러오는 중...</div>
  </header>

  <div class="controls">
    <label>최소 검색수
      <input type="number" id="minSearch" value="300" step="50">
    </label>
    <label>최대 상품수
      <input type="number" id="maxProducts" value="1000" step="100">
    </label>
    <div class="stat">
      <div class="stat-item">
        <div class="stat-num" id="statFiltered">–</div>
        <div class="stat-label">필터 통과</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statCats">–</div>
        <div class="stat-label">순회한 카테고리</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="statTotal">–</div>
        <div class="stat-label">전체 후보</div>
      </div>
    </div>
  </div>

  <main>
    <table id="table">
      <thead>
        <tr>
          <th data-key="keyword" style="text-align:left">키워드</th>
          <th data-key="category" style="text-align:left">대표 카테고리</th>
          <th data-key="search">검색수</th>
          <th data-key="products">상품수</th>
          <th data-key="comp">경쟁강도</th>
          <th data-key="score">기회점수</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">
      아직 수집된 데이터가 없습니다.
    </div>
  </main>

<script>
let RAW = { keywords: [], generated_at: null, total_scanned: 0, categories_covered: [] };
let sortKey = "score";
let sortDir = -1;

async function loadData() {
  try {
    const res = await fetch("data.json?_=" + Date.now());
    RAW = await res.json();
  } catch (e) {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("generated-at").textContent = "데이터 파일을 아직 찾을 수 없음 (data.json)";
    return;
  }
  document.getElementById("generated-at").textContent =
    "마지막 갱신: " + (RAW.generated_at || "알 수 없음") +
    " · 아이템스카우트 아이템발굴 기반 (수동 갱신, 순회 진행중)";
  render();
}

function render() {
  const minSearch = Number(document.getElementById("minSearch").value) || 0;
  const maxProducts = Number(document.getElementById("maxProducts").value) || Infinity;

  let rows = (RAW.keywords || []).filter(r => {
    if ((r.search || 0) < minSearch) return false;
    if ((r.products ?? 0) > maxProducts) return false;
    return true;
  });

  rows.sort((a, b) => {
    const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
    if (typeof av === "string") return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });

  const maxScore = Math.max(1, ...rows.map(r => r.score || 0));

  document.getElementById("statFiltered").textContent = rows.length;
  document.getElementById("statCats").textContent = (RAW.categories_covered || []).length;
  document.getElementById("statTotal").textContent = RAW.total_scanned || (RAW.keywords || []).length;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  document.getElementById("emptyMsg").style.display = rows.length ? "none" : "block";

  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="kw">${r.keyword}</td>
      <td>${r.category || "-"}</td>
      <td>${(r.search ?? 0).toLocaleString()}</td>
      <td>${r.products != null ? r.products.toLocaleString() : "-"}</td>
      <td>${r.comp || "-"}</td>
      <td>
        ${r.score != null ? r.score.toFixed(2) : "-"}
        <div class="ratio-bar-bg"><div class="ratio-bar-fill" style="width:${((r.score||0)/maxScore*100).toFixed(0)}%"></div></div>
      </td>
    `;
    tbody.appendChild(tr);
  }
}

document.querySelectorAll("th[data-key]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
    render();
  });
});
document.getElementById("minSearch").addEventListener("input", render);
document.getElementById("maxProducts").addEventListener("input", render);

loadData();
</script>
</body>
</html>
